<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de País</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${pais.id == null} ? 'Agregar Nuevo País' : 'Editar País'">Formulario País</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/paises/guardar}" th:object="${pais}" method="post">

                <input type="hidden" th:if="${pais.id != null}" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Nombre del País:</label>
                    <input type="text" th:field="*{nombre}" class="form-form-control form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Presidente Actual:</label>
                    <input type="text" th:field="*{presidente}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Continente:</label>
                    <input type="text" th:field="*{continente}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Idioma Principal:</label>
                    <input type="text" th:field="*{idiomaPrincipal}" class="form-control" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Número de Habitantes:</label>
                    <input type="number" th:field="*{numHabitantes}" class="form-control" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de Democracia:</label>
                    <input type="text" th:field="*{tipoDemocracia}" class="form-control" />
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/paises}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar País</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
