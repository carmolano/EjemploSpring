<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de los Países</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>LISTA DE LOS PAISES ASIGNADOS</h2>
        <a th:href="@{/paises/nuevo}" class="btn btn-primary">agregar el nuevo pais</a>
    </div>

    <div class="card shadow">
        <div class="card-body text-center" th:if="${#lists.isEmpty(ListaPaises)}">
            <p class="text-muted mb-0">NO HAY PAISES REGISTRADOS TODAVIA EN EL MOMENTO</p>
        </div>

        <div class="table-responsive" th:if="${not #lists.isEmpty(ListaPaises)}">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Presidente</th>
                    <th>Continente</th>
                    <th>Idioma principal</th>
                    <th>Habitantes</th>
                    <th>Democracia</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${ListaPaises}">
                    <td th:text="${p.id}">1</td>
                    <td class="fw-bold" th:text="${p.nombre}">Colombia</td>
                    <td th:text="${p.presidente}">Presidente</td>
                    <td th:text="${p.continente}">América</td>
                    <td th:text="${p.num_principal}">Español</td>
                    <td th:text="${p.num_habitantes}">0</td>
                    <td th:text="${p.num_democracia}">Presidencial</td>
                    <td>
                        <a th:href="@{/paises/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/paises/eliminar/{id}(id=${p.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿confirmar eliminar este pais?');">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
