<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <title>Consulta de Paises profesor jhon arrieta</title>
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class = "container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col.md-8">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0" th:text="${pais.id == null}?'ingresar Nuevo Pais':'Editar el pais '">Formulario del Pais</h4>

                </div>
                <div class="card-body">
                    <form th:action="@{paises/guardar}" th:object="${pais}" method="post">
                       <imput type="hidden" th:field="*{id}"/>

                        <div class="rw">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre del pais:</label>
                                <input type="text" th:field="*{presidente}" class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Presidente actual </label>
                                <imput type="text" th:fiel="*{presidente actual}" class="form-control" required />
                            </div>
                            </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre del Himno</label>
                                <t type="text" th:field="*{nombreHimno}" class="form-control" />
                            </div>
                        </div>

                        <div clas="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">N de habitantes</label>
                                <input type="text" th:field="*{numHabitantes}" class="form-control"/>

                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">N de Habitantes:</label>
                                <input type="number" th:field="*{numHabitantes}" class="form-control" required />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">N de Departamentos:</label>
                                <input type="number" th:field="*{numDepartamentos}" class="form-control" />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">N de Municipios:</label>
                                <input type="number" th:field="*{numMunicipios}" class="form-control" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Idioma Principal:</label>
                                <input type="text" th:field="*{idiomaPrincipal}" class="form-control" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">N de Universidades:</label>
                                <input type="number" th:field="*{numUniversidades}" class="form-control" />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Tipo de Democracia:</label>
                            <input type="text" th:field="*{tipoDemocracia}" class="form-control" placeholder="Ej: Presidencialista, Parlamentaria" />
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/paises}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar País</button>

                        </div>
                    </form>
                </div>
            </div>

        </div>


    </div>

</div>

</body>
</html>
